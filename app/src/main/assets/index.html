
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>U.S. Embassy Security Checklist</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        padding: 15px;
        font-family: Arial, sans-serif;
        background: #f2f4f7;
        color: #222;
    }

    .container {
        max-width: 600px;
        margin: auto;
        background: white;
        padding: 20px;
        border-radius: 15px;
        box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    h1 {
        text-align: center;
        font-size: 24px;
        margin-bottom: 20px;
    }

    h2 {
        font-size: 18px;
        margin-top: 22px;
        border-bottom: 2px solid #ddd;
        padding-bottom: 7px;
    }

    label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
    }

    input[type="text"],
    input[type="date"],
    select,
    textarea {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border: 1px solid #ccc;
        border-radius: 8px;
        font-size: 16px;
    }

    textarea {
        min-height: 90px;
        resize: vertical;
    }

    .check-item {
        display: flex;
        align-items: center;
        padding: 13px;
        margin: 8px 0;
        background: #f7f7f7;
        border-radius: 8px;
        border: 1px solid #ddd;
    }

    .check-item input {
        width: 22px;
        height: 22px;
        margin-right: 12px;
    }

    .progress-box {
        margin-top: 20px;
        padding: 15px;
        background: #f5f5f5;
        border-radius: 10px;
        text-align: center;
    }

    .progress-bar {
        width: 100%;
        height: 20px;
        background: #ddd;
        border-radius: 10px;
        overflow: hidden;
        margin-top: 10px;
    }

    .progress {
        height: 100%;
        width: 0%;
        background: #28a745;
        transition: width 0.3s;
    }

    button {
        width: 100%;
        padding: 14px;
        margin-top: 12px;
        border: none;
        border-radius: 9px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
    }

    .save {
        background: #007bff;
        color: white;
    }

    .whatsapp {
        background: #25D366;
        color: white;
    }

    .reset {
        background: #dc3545;
        color: white;
    }

    .report {
        background: #343a40;
        color: white;
    }

    .small {
        text-align: center;
        font-size: 12px;
        color: #666;
        margin-top: 15px;
    }
</style>
</head>

<body>

<div class="container">

    <h1>🛡️ U.S. Embassy Security Checklist</h1>

    <label>Guard Name</label>
    <input type="text" id="guardName" placeholder="Enter guard name">

    <label>Shift</label>
    <select id="shift">
        <option value="Day Shift">Day Shift</option>
        <option value="Night Shift">Night Shift</option>
    </select>

    <label>Date</label>
    <input type="date" id="date">

    <h2>Security Equipment</h2>

    <div class="check-item">
        <input type="checkbox" class="item" data-name="PR-24">
        <span>PR-24</span>
    </div>

    <div class="check-item">
        <input type="checkbox" class="item" data-name="Whistle">
        <span>Whistle</span>
    </div>

    <div class="check-item">
        <input type="checkbox" class="item" data-name="IDNS">
        <span>IDNS</span>
    </div>

    <div class="check-item">
        <input type="checkbox" class="item" data-name="Handcuffs">
        <span>Handcuffs</span>
    </div>

    <div class="check-item">
        <input type="checkbox" class="item" data-name="Keys">
        <span>Keys</span>
    </div>

    <h2>Uniform</h2>

    <div class="check-item">
        <input type="checkbox" class="item" data-name="T-shirt">
        <span>T-shirt</span>
    </div>

    <div class="check-item">
        <input type="checkbox" class="item" data-name="Trousers">
        <span>Trousers</span>
    </div>

    <div class="check-item">
        <input type="checkbox" class="item" data-name="Shoes">
        <span>Shoes</span>
    </div>

    <div class="progress-box">
        <strong>Checklist Progress</strong>

        <div id="progressText">0% Complete</div>

        <div class="progress-bar">
            <div class="progress" id="progress"></div>
        </div>

        <div id="countText">0 of 8 checked</div>
    </div>

    <h2>Notes / Remarks</h2>

    <textarea id="notes"
        placeholder="Enter any observations, missing equipment, or remarks..."></textarea>

    <button class="save" onclick="saveData()">
        💾 Save Checklist
    </button>

    <button class="report" onclick="showReport()">
        📋 Daily Report
    </button>

    <button class="whatsapp" onclick="sendWhatsApp()">
        📱 Submit Report to WhatsApp
    </button>

    <button class="reset" onclick="resetData()">
        🔄 Reset Checklist
    </button>

    <div class="small">
        WhatsApp: +251 911 151 017
    </div>

</div>
